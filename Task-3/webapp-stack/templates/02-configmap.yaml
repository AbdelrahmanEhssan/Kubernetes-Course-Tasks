apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
  namespace: {{ .Release.Namespace }}
data:
  APP_TITLE: {{ .Values.app.title | quote }}
  APP_ENV: {{ .Values.app.environment | quote }}
  MYSQL_WRITE_HOST: "mysql-write"
  MYSQL_READ_HOST: "mysql-read"
  MYSQL_PORT: {{ .Values.mysql.port | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.auth.database | quote }}
