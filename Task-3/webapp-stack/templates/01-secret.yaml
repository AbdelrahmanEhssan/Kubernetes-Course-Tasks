apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  root-password: {{ required "mysql.auth.rootPassword is required" .Values.mysql.auth.rootPassword | quote }}
  app-user: {{ .Values.mysql.auth.user | quote }}
  app-password: {{ required "mysql.auth.appPassword is required" .Values.mysql.auth.appPassword | quote }}
  replication-password: {{ required "mysql.auth.replicationPassword is required" .Values.mysql.auth.replicationPassword | quote }}
