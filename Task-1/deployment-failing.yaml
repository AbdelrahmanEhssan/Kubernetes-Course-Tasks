apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      shareProcessNamespace: true
      initContainers:
        - name: init-done
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - echo done; exit 1
      containers:
        - name: nginx
          image: nginx:stable-alpine
          env:
            - name: TZ
              value: "EET-2"
          command:
            - /bin/sh
            - -c
            - |
              printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
        - name: time-updater
          image: busybox:1.36
          env:
            - name: TZ
              value: "EET-2"
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                pid="$(pgrep -o nginx || true)"
                if [ -n "$pid" ] && [ -d "/proc/$pid/root/usr/share/nginx/html" ]; then
                  printf 'hello in MLOPS MENA COMMUNITY : %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" > "/proc/$pid/root/usr/share/nginx/html/index.html"
                fi
                sleep 5
              done
